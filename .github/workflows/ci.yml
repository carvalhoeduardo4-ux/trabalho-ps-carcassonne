name: Backend CI

on:
  pull_request:
    branches: [prototipo_entrega_2]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Maven verify
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml verify
      - name: HTTP smoke
        run: ./backend/scripts/smoke-backend.sh
