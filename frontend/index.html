<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carcassonne Digital</title>
  <meta name="description" content="Implementação de Carcassonne para 2 a 5 jogadores no mesmo dispositivo, com regras processadas pelo backend.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM UMD (versão fixa; o React 19 não publica mais UMD) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- Os módulos importam 'react' normalmente; o import map aponta para o React global -->
  <script type="importmap">
    { "imports": { "react": "./src/react.js" } }
  </script>

  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React from 'react';
    import { App } from './src/App.js';

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
